[project]
name = "autoaws-backend"
version = "0.1.0"
description = "AutoAWS backend — AI assistant that diagnoses AWS incidents using read-only access"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "boto3>=1.34",
    "dnspython>=2.6",
    "anthropic[bedrock]>=2.6,<3",  # Claude on Bedrock (Mantle client) / Claude API
    "jsonschema>=4.20",  # tool input validation
    "mangum>=0.19",  # api-handler on Lambda (RUNTIME=lambda)
    "mcp>=2.3,<3",  # MCP bridge (LLM_PROVIDER=mcp): an MCP client plays the LLM
    "pyjwt[crypto]>=2.8",  # AUTH_MODE=cognito: verify Cognito access tokens (JWKS)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "moto[ec2,sts,ssm,route53,elbv2,iam,dynamodb]>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's `Depends()` in defaults is the idiomatic pattern

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
