# Local dev stack: backend (FastAPI, :8000) + frontend (nginx serving the Vite build, :5173).
# Usage: cp backend/.env.example backend/.env && docker compose up --build
services:
  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      STORAGE_BACKEND: dynamodb
      DYNAMODB_CREATE_TABLE: "false"
      CORS_ORIGINS: "*"
    volumes:
      # Platform AWS credentials for role connections (optional)
      - ~/.aws:/root/.aws:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
