AWSTemplateFormatVersion: "2010-09-09"
Description: AutoAWS platform storage for the EC2 backend (single DynamoDB table).

Parameters:
  TableName:
    Type: String
    Default: autoaws
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "[a-zA-Z0-9_.-]+"
    Description: Unique table name in this account and Region.
  EnablePointInTimeRecovery:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable continuous backups (additional charges apply).

Conditions:
  PointInTimeRecoveryEnabled: !Equals [!Ref EnablePointInTimeRecovery, "true"]

Resources:
  AutoAWSTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ById
          KeySchema:
            - AttributeName: id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PointInTimeRecoveryEnabled, true, false]
      Tags:
        - Key: Project
          Value: AutoAWS

Outputs:
  TableName:
    Description: Set DYNAMODB_TABLE to this value.
    Value: !Ref AutoAWSTable
  TableArn:
    Description: Scope the EC2 platform role permissions to this table and its indexes.
    Value: !GetAtt AutoAWSTable.Arn
  Region:
    Description: Set DYNAMODB_REGION to this value.
    Value: !Ref AWS::Region
  EndpointUrl:
    Description: Optional DYNAMODB_ENDPOINT_URL; leave empty to use the SDK regional endpoint.
    Value: !Sub "https://dynamodb.${AWS::Region}.${AWS::URLSuffix}"
