AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AutoAWS test scenario KB5 (dev only). worker-01 in a subnet that does not auto-assign public
  IPs: the route to the Internet gateway is fine, but the instance has no public IP. The fault
  is built in (no fault step).

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: String
    Default: ""

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: autoaws-kb5-vpc }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false # the incident
      Tags: [{ Key: Name, Value: autoaws-kb5-subnet }]
  SubnetRt:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref PublicRt }
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "worker-01: SSH from anywhere"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: autoaws-kb5-worker-sg }]
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRt]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref Sg]
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      Tags: [{ Key: Name, Value: worker-01 }]

Outputs:
  InstanceId: { Value: !Ref Instance }
  SubnetId: { Value: !Ref Subnet }
