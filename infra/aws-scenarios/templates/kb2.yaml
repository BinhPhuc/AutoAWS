AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AutoAWS test scenario KB2 (dev only). app-server runs a Docker app on 8080; app.<domain>
  points to its public IP. Built in: the security group does not open 8080. Fault
  (scenario.py fault kb2): stop/start the instance, so its public IP changes and the A record
  is left pointing to the old IP.

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: String
    Default: ""
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public hosted zone of a domain you own (delegated at the registrar)
  DomainName:
    Type: String
    Description: The zone's domain, e.g. example.com (the record is app.<domain>)

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: autoaws-kb2-vpc }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetRt:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref PublicRt }
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "app-server: SSH, HTTP, HTTPS (8080 deliberately missing)"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: autoaws-kb2-app-sg }]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRt]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref Sg]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      Tags: [{ Key: Name, Value: app-server }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux
          dnf install -y docker
          systemctl enable --now docker
          docker run -d --restart always -p 8080:80 public.ecr.aws/nginx/nginx:stable
  AppRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub app.${DomainName}
      Type: A
      TTL: "60"
      ResourceRecords: [!GetAtt Instance.PublicIp]

Outputs:
  InstanceId: { Value: !Ref Instance }
  SecurityGroupId: { Value: !Ref Sg }
  RecordName: { Value: !Sub "app.${DomainName}" }
  RecordIp: { Value: !GetAtt Instance.PublicIp }
