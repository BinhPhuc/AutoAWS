AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AutoAWS test scenario KB4 (dev only). api-server with a security group open on 22; a custom
  network ACL denies outbound ephemeral ports 1024-65535. Fault (scenario.py fault kb4): the
  subnet is switched to that ACL, so SSH hangs (the replies never leave).

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: String
    Default: ""

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: autoaws-kb4-vpc }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetRt:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref PublicRt }
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "api-server: SSH and HTTPS from anywhere"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: autoaws-kb4-api-sg }]
  # Not associated at creation: the subnet starts on the VPC's default ACL (allow all).
  FaultAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: autoaws-kb4-acl }]
  AclInAllowAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref FaultAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
  AclOutDenyEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref FaultAcl
      RuleNumber: 90
      Protocol: 6
      RuleAction: deny
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 1024, To: 65535 }
  AclOutAllowAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref FaultAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRt]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref Sg]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      Tags: [{ Key: Name, Value: api-server }]

Outputs:
  InstanceId: { Value: !Ref Instance }
  VpcId: { Value: !Ref Vpc }
  SubnetId: { Value: !Ref Subnet }
  FaultAclId: { Value: !Ref FaultAcl }
